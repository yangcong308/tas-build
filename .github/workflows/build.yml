name: Build TAS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone upstream source
        run: git clone --depth 1 https://github.com/ikunkk02-afk/The-Art-of-Stockings.git src

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        working-directory: src
        run: |
          chmod +x ./gradlew
          ./gradlew jar --no-daemon --console=plain

      - name: List outputs
        working-directory: src
        run: ls -la build/libs

      - name: Collect jar
        run: |
          mkdir -p dist
          cp src/build/libs/*.jar dist/
          rm -f dist/*-sources.jar
          ls -la dist

      - name: Commit built jar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "ci: built jar [skip ci]" || echo "nothing to commit"
          git push

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: The Art of Stockings 0.11.0 built jar
          body: |
            Compiled from ikunkk02-afk/The-Art-of-Stockings
            Minecraft 1.21.1 / NeoForge 21.1.265+ / Java 21
          files: dist/*.jar
          fail_on_unmatched_files: true
